name: Recipe Master standards audit

on:
  push:
    branches: [main, 'chatgpt/market-reference-calibration-20261001']
    paths:
      - 'shared_data.js'
      - 'recipe-guide-seeds.js'
      - 'recipe-market-references.js'
      - 'recipe-production-editor.js'
      - 'recipe-cost-editor.html'
      - 'poriyal-recipes.js'
      - 'recipe-master-sync.js'
      - 'recipe-master-shards.js'
      - 'bobs-google-data.js'
      - 'recipe-master.html'
      - 'method2-core.js'
      - 'tests/recipe-standards-v2.cjs'
      - 'tests/market-reference-calibration.cjs'
      - 'tests/recipe-master-sync.cjs'
      - 'tests/recipe-master-shards.cjs'
      - '.github/workflows/recipe-standards-v2.yml'
  workflow_dispatch:

jobs:
  recipe-standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit all BOBS production recipes
        run: node tests/recipe-standards-v2.cjs
      - name: Audit researched market reference layer
        run: node tests/market-reference-calibration.cjs
      - name: Test Recipe Master Google read-back retry
        run: node tests/recipe-master-sync.cjs
      - name: Test Recipe Master sharded storage integrity
        run: node tests/recipe-master-shards.cjs
