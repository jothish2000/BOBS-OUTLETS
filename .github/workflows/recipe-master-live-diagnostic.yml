name: Recipe Master live diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recipe-master-live-diagnostic.yml'

permissions:
  contents: read

jobs:
  live-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify normal Recipe Master reload
        shell: bash
        run: |
          URL='https://jothish2000.github.io/BOBS-OUTLETS/recipe-master.html?diag=20260926-reload2'
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=40000 --dump-dom "$URL" > /tmp/master.html 2> /tmp/master.err || true
          STATUS=$(grep -oE '<span class="tag" id="status">[^<]*</span>' /tmp/master.html || true)
          echo "$STATUS"
          echo "cards $(grep -o 'class=\"stack recipe-card\"' /tmp/master.html | wc -l)"
          ! echo "$STATUS" | grep -q 'SAFE MODE'
          echo "$STATUS" | grep -q 'Google master loaded — current standard verified'
          ! grep -E 'Uncaught|ReferenceError|SyntaxError|TypeError' /tmp/master.err
      - name: Verify Item COGS reads sharded Recipe Master
        shell: bash
        run: |
          URL='https://jothish2000.github.io/BOBS-OUTLETS/recipe-item-cogs.html?outlet=1&item=Idli&qty=120&model=production&diag=20260926b'
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=40000 --dump-dom "$URL" > /tmp/cogs.html 2> /tmp/cogs.err || true
          grep -oE '<div id="status" class="note">[^<]*</div>' /tmp/cogs.html || true
          grep -q 'Permanent Google Recipe Master read successfully' /tmp/cogs.html
          grep -q 'Recipe<b>FOUND</b>' /tmp/cogs.html
          ! grep -E 'Uncaught|ReferenceError|SyntaxError|TypeError' /tmp/cogs.err
      - name: Verify active Google manifest remains V2
        shell: bash
        run: |
          VAULT='https://script.google.com/macros/s/AKfycbwmvTLGxFQ2KQvzP9tr1Ry5LOi8EWRcfP6YxtOKiLUCLJqDpQ8Nsk12zThc1Yj4A9Pf4A/exec'
          curl -fsSL --max-time 30 "$VAULT?action=moduleGet&outletId=COMPANY&module=RECIPE_MASTER&recordKey=STANDARD_V1&callback=diagcb&_bobs=$(date +%s%N)" > /tmp/master.js
          python - <<'PY'
          from pathlib import Path
          import json,re
          t=Path('/tmp/master.js').read_text();m=re.search(r'diagcb\((.*)\)\s*;?\s*$',t,re.S);assert m
          d=(json.loads(m.group(1)).get('data') or {})
          print('standardVersion',d.get('standardVersion'),'storageMode',d.get('storageMode'),'recipeCount',d.get('recipeCount'),'chunks',len(d.get('chunkKeys') or []))
          assert d.get('standardVersion')=='2026-09-SMALL-OUTLET-V2'
          assert d.get('storageMode')=='SHARDED_RECIPE_MASTER_V2'
          assert int(d.get('recipeCount'))==104
          PY
