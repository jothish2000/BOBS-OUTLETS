name: Saved progress real-read check
on:
  push:
    branches: [codex/saved-progress-read-20261105]
    paths:
      - 'scripts/verify-saved-progress-live.cjs'
      - 'bobs-roadmap.js'
      - 'bobs-google-data.js'
      - 'bobs-kitchen-store.js'
      - 'bobs-roadmap-outlet-flow.js'
      - '.github/workflows/saved-progress-read.yml'
permissions:
  contents: read
jobs:
  saved-progress:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix "$RUNNER_TEMP/bobs-progress" playwright@1.58.2 --no-audit --no-fund
      - name: Check real Google reads without writes
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/bobs-progress/node_modules/playwright
          BOBS_PROGRESS_DIAGNOSIS: '0'
          BOBS_PROGRESS_CANDIDATE: '1'
        run: node scripts/verify-saved-progress-live.cjs
