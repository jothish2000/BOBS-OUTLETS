name: Diagnose outlet guide (no production writes)
on:
  push:
    branches: ['codex/diagnose-outlet-show-20261027']
    paths:
      - 'scripts/diagnose-outlet-show*.cjs'
      - '.github/workflows/diagnose-outlet-show.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix "$RUNNER_TEMP/outlet-diagnosis" playwright@1.58.2 --no-audit --no-fund
      - name: Exact user sequence and boundary cases with intercepted fixtures
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/outlet-diagnosis/node_modules/playwright
        run: node scripts/diagnose-outlet-show.cjs
      - name: Live saved IDs and guide focus with every write blocked
        if: always()
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/outlet-diagnosis/node_modules/playwright
        run: node scripts/diagnose-outlet-show-live.cjs
