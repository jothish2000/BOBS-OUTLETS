name: Patch Recipe Master V2 idempotent reload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-recipe-v2-idempotent.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make current V2 reload read-only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('recipe-master.html')
          s=p.read_text()
          old="""    const changed=JSON.stringify(current.recipes||[])!==JSON.stringify(merged)||current.standardVersion!==STD_VERSION||current.schemaVersion!==STANDARD_SCHEMA;"""
          new="""    // A published standard version is immutable. Once the verified V2 sharded master is active,\n    // normal reloads must read it rather than regenerate it. Future seed changes must bump STD_VERSION.\n    const changed=!(current.standardVersion===STD_VERSION&&current.schemaVersion===STANDARD_SCHEMA&&current.storageMode==='SHARDED_RECIPE_MASTER_V2');"""
          if s.count(old)!=1: raise SystemExit('Expected migration-change expression not found exactly once')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          git config user.name 'BOBS 111Q Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add recipe-master.html
          git commit -m 'Make Recipe Master V2 reload idempotent'
          git push origin HEAD:main
