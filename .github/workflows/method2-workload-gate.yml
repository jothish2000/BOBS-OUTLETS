name: Method 2 workload gate audit

on:
  push:
    paths:
      - 'method2.html'
      - 'method2-list.js'
      - 'method2-select.js'
      - 'method2-select.html'
      - 'bobs-config.js'
      - 'tests/method2-setup-before-workload.cjs'
      - 'tests/method2-outlet-handoff.cjs'
      - 'method2-workload-gate.js'
      - 'method2-flow-review.js'
      - 'workload-planner.html'
      - 'tests/method2-workload-gate.cjs'
      - 'tests/method2-workspace.cjs'
      - '.github/workflows/method2-workload-gate.yml'
  pull_request:
    paths:
      - 'method2.html'
      - 'method2-list.js'
      - 'method2-select.js'
      - 'method2-select.html'
      - 'bobs-config.js'
      - 'tests/method2-setup-before-workload.cjs'
      - 'tests/method2-outlet-handoff.cjs'
      - 'method2-workload-gate.js'
      - 'method2-flow-review.js'
      - 'workload-planner.html'
      - 'tests/method2-workload-gate.cjs'
      - 'tests/method2-workspace.cjs'
      - '.github/workflows/method2-workload-gate.yml'

jobs:
  workload-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test workload completion gate
        run: node --test tests/method2-workload-gate.cjs
      - name: Install isolated DOM test dependency
        run: npm install --prefix "$RUNNER_TEMP/bobs-dom" jsdom@30.1.1 --no-audit --no-fund
      - name: Test selection to item setup before staffing
        env:
          JSDOM_PATH: ${{ runner.temp }}/bobs-dom/node_modules/jsdom
        run: |
          node tests/method2-setup-before-workload.cjs
          node tests/method2-outlet-handoff.cjs
      - name: Syntax check changed browser scripts
        run: |
          node --check method2-list.js
          node --check method2-select.js
          node --check method2-workload-gate.js
          node --check method2-flow-review.js\n          node --check recipe-production-editor.js
      - name: Run historical workspace browser test when Playwright is installed
        run: |
          if node -e "require.resolve('playwright')" >/dev/null 2>&1; then
            PLAYWRIGHT_PATH="$(node -e "process.stdout.write(require.resolve('playwright'))")" node --test tests/method2-workspace.cjs
          else
            echo "SKIP: tests/method2-workspace.cjs requires Playwright; this Linux runner does not provide it. Focused gate tests and syntax checks remain mandatory."
          fi
