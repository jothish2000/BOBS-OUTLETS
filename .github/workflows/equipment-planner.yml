name: Equipment planner regression
on:
  push:
    branches: [main]
    paths:
      - 'equipment-planner-core.js'
      - 'equipment-planner.js'
      - 'equipment-planner.html'
      - 'tests/equipment-planner.cjs'
      - 'tests/equipment-planner-persistence.cjs'
      - '.github/workflows/equipment-planner.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/equipment-planner.cjs

      - run: node --test tests/equipment-planner-persistence.cjs
