name: BOBS Google-Only Data Layer
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace browser-cache gate with Google-only layer
        shell: python
        run: |
          from pathlib import Path
          files=['outlets.html','method1.html','method2.html','staff.html','fixed-expenses.html','roster.html']
          old='<script src="bobs-entry-gate.js"></script>'
          new='<script src="bobs-google-only.js"></script>'
          changed=[]
          for f in files:
              p=Path(f)
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              original=s
              s=s.replace(old,new)
              if new not in s:
                  s=s.replace('</head>',new+'\n</head>',1)
              if s!=original:
                  p.write_text(s,encoding='utf-8')
                  changed.append(f)
          Path('/tmp/changed.txt').write_text('\n'.join(changed))
      - name: Commit patch
        shell: bash
        run: |
          if [ -s /tmp/changed.txt ]; then
            git config user.name 'BOBS automation'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A -- outlets.html method1.html method2.html staff.html fixed-expenses.html roster.html
            git commit -m 'BOBS: make core modules Google-only and remove browser cache gate'
            git push
          else
            echo 'No files needed patching.'
          fi
