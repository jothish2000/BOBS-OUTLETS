<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Outlet Analysis</title><link rel="stylesheet" href="style.css"><style>.analysis-wrap{overflow-x:auto}.analysis{border-collapse:collapse;min-width:900px;width:100%}.analysis th,.analysis td{border:1px solid var(--line);padding:10px;text-align:right}.analysis th{background:var(--paper-dark)}.analysis .outlet-head{text-align:center;background:var(--ink);color:white}.analysis .method-head{text-align:center}.analysis .metric{text-align:left;font-weight:600}.notdone{color:var(--ink-soft);font-style:italic}.num{white-space:nowrap}</style></head><body><header><p class="eyebrow"><a href="index.html" style="color:inherit;text-decoration:none;">← Home</a></p><h1>Outlet Analysis</h1><p class="sub">Every outlet gets a paired Method 1 / Method 2 comparison. An unselected method remains visible as “Not Analysed”.</p></header><section><div class="section-head"><h2>Outlet-by-outlet comparison</h2><span class="tag" id="countTag">0 outlets</span></div><div class="analysis-wrap"><table class="analysis" id="analysisTable"></table></div></section><div class="export-bar"><a class="export-btn" href="outlets.html" style="text-decoration:none;">Back to Outlets Setup</a></div><footer>Method 1 and Method 2 cost and profitability results are stored separately for every outlet.</footer><script src="shared_data.js"></script><script>
const OUT='outlets-master',DATA='outlet-analysis-data';function money(v){return '₹'+Math.round(v||0).toLocaleString('en-IN')}function m1sale(s){if(!s)return 0;let t=0;(s.custVals||[]).forEach((c,i)=>t+=c*((s.basketVals||[])[i]||0));return t}function m2sale(s){if(!s)return 0;let t=0;const q=s.qtys||{};Object.keys(q).forEach(k=>{const [cat,i]=k.split('|');const item=ITEM_DATA[cat]?.[i];if(!item)return;const e=q[k],qty=typeof e==='object'?e.qty:e,unit=typeof e==='object'?e.unit:null;t+=(unit==='g'?qty/1000:qty)*(item.price||0)});return t}function getM1Sale(x){if(typeof x.method1DailySales==='number')return x.method1DailySales;if(x.method1&&typeof x.method1.dailySales==='number')return x.method1.dailySales;return m1sale(x.method1)}function getM2Sale(x){if(typeof x.method2DailySales==='number')return x.method2DailySales;return m2sale(x.method2)}function render(){let os=[];try{os=JSON.parse(localStorage.getItem(OUT)||'[]')||[]}catch(e){}let d={};try{d=JSON.parse(localStorage.getItem(DATA)||'{}')||{}}catch(e){}document.getElementById('countTag').textContent=os.length+(os.length===1?' outlet':' outlets');let h='<tr><th rowspan="2" class="metric">Metric</th>';os.forEach(o=>h+=`<th colspan="2" class="outlet-head">${o.name||'Outlet '+o.id}<br><small>${o.id}</small></th>`);h+='</tr><tr>';os.forEach(()=>h+='<th class="method-head">Method 1</th><th class="method-head">Method 2</th>');h+='</tr>';const rows=[['Analysed?',o=>{const x=d[o.id]||{};return [x.method1Selected?'Yes':'Not Analysed',x.method2Selected?'Yes':'Not Analysed']}],['Expected Daily Sale',o=>{const x=d[o.id]||{};return [x.method1Selected?money(getM1Sale(x)):'Not Analysed',x.method2Selected?money(getM2Sale(x)):'Not Analysed']}],['Purchase Cost / Day',o=>{const x=d[o.id]||{};return [x.method1Selected?money(x.method1PurchaseCost):'Not Analysed',x.method2Selected?money(x.method2PurchaseCost):'Not Analysed']}],['Gross Profit / Day',o=>{const x=d[o.id]||{};const m1s=getM1Sale(x),m2s=getM2Sale(x);return [x.method1Selected?money(m1s-(x.method1PurchaseCost||0)):'Not Analysed',x.method2Selected?money(m2s-(x.method2PurchaseCost||0)):'Not Analysed']}]];rows.forEach(r=>{h+=`<tr><td class="metric">${r[0]}</td>`;os.forEach(o=>r[1](o).forEach(v=>h+=`<td class="${v==='Not Analysed'?'notdone':''}">${v}</td>`));h+='</tr>'});document.getElementById('analysisTable').innerHTML=h}render();</script></body></html>
