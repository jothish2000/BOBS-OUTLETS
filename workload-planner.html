<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOBS — Workload & Staffing Planner</title>
<style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#17233c}header{background:#123b68;color:white;padding:18px 5%}main{max-width:1200px;margin:auto;padding:20px}.card{background:white;border:1px solid #d8e0eb;border-radius:10px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}input,select,button{padding:8px;border:1px solid #b9c5d4;border-radius:6px}button{background:#087f4f;color:white;font-weight:700}.secondary{background:#eef3f8;color:#17324f}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #e3e8ef;text-align:left}.warn{background:#fff4d6;padding:10px}.ok{background:#e8f7ee;padding:10px}.muted{color:#607086}details{margin:10px 0}summary{font-weight:700;cursor:pointer}</style>
<script src="bobs-config.js"></script><script src="bobs-google-data.js"></script><script src="shared_data.js"></script><script src="method2-core.js"></script><script src="workload-core.js?v=timeline-v2"></script></head>
<body><header><h1>Workload & Staffing Planner</h1><p>Menu → quantity → recipe/batch time → shared preparation → role workload → reuse/create position.</p></header><main>
<div id="status" class="card">Loading…</div><div class="card"><button id="import">Import selected Method 2 menu</button> <button id="add" class="secondary">+ Add workload</button> <button id="calc">Calculate staffing</button></div>
<div id="profiles"></div><div class="card"><h2>Timeline & position capacity</h2><div id="result"></div></div>
<div class="card"><label><input type="checkbox" id="approved"> Owner reviewed this planning scenario</label><p><button id="save">Save staffing plan to Google</button> <button id="reload" class="secondary">Reload saved plan</button></p><div id="saveStatus"></div></div>
</main><script>
const $=x=>document.getElementById(x),q=new URLSearchParams(location.search),outlet=q.get('outlet')||'';let m2=null,plan={profiles:[]};
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function defaultRole(n){n=n.toLowerCase();if(/vada|bajji|bonda|samosa/.test(n))return 'Vada / Snack Master';if(/tea|coffee/.test(n))return 'Tea Master';if(/idli|pongal|upma|rice|biryani/.test(n))return 'Cook / Tiffin Master';return 'Production Staff'}
function recipeTiming(r,name){const t=r?.productionTiming||{};const idli=/\bidl[yi]\b/i.test(name||'');return {equipment:t.equipment||(idli?'Idli Steamer':''),setup:t.setupMin??(idli?30:''),active:t.activeMinPerCycle??(idli?10:''),machine:t.machineMinPerCycle??(idli?25:''),finish:t.finishMinPerCycle??(idli?5:''),clean:t.cleanupMin??(idli?15:''),role:t.role||defaultRole(name||''),sharedKey:idli?'':(r?.sharedBase||''),shared:!!(!idli&&r?.sharedBase)}}
function card(p,i){return '<details open class="card profile" data-i="'+i+'"><summary>'+esc(p.name||'Workload')+'</summary><div class="grid">'+
'<label>Planned qty<input class="qty" type="number" value="'+esc(p.qty)+'"></label><label>Batch/equipment capacity<input class="capacity" type="number" value="'+esc(p.capacity)+'"></label>'+
'<label>Start<input class="start" type="time" value="'+esc(p.start||'05:00')+'"></label><label>Role<input class="role" value="'+esc(p.role||defaultRole(p.name||''))+'"></label>'+
'<label>Position / reuse<input class="position" placeholder="Cook1 / VadaMaster1" value="'+esc(p.position||'')+'"></label><label>Equipment<input class="equipment" value="'+esc(p.equipment||'')+'"></label>'+
'<label>Setup min once<input class="setup" type="number" value="'+esc(p.setup||0)+'"></label><label>Hands-on min / cycle<input class="active" type="number" value="'+esc(p.active||0)+'"></label>'+
'<label>Machine min / cycle<input class="machine" type="number" value="'+esc(p.machine||0)+'"></label><label>Finish min / cycle<input class="finish" type="number" value="'+esc(p.finish||0)+'"></label>'+
'<label>Cleanup min once<input class="clean" type="number" value="'+esc(p.clean||0)+'"></label><label>Shared base key<input class="sharedKey" placeholder="COOKED_RICE_BASE" value="'+esc(p.sharedKey||'')+'"></label></div>'+
'<label><input class="shared" type="checkbox" '+(p.shared?'checked':'')+'> Shared preparation — count this base once across matching key</label> <button class="remove secondary">Remove</button></details>'}
function render(){ $('profiles').innerHTML=plan.profiles.map(card).join('');document.querySelectorAll('.remove').forEach((b,i)=>b.onclick=()=>{readCards();plan.profiles.splice(i,1);render()})}
function readCards(){plan.profiles=[...document.querySelectorAll('.profile')].map(d=>{let g=c=>d.querySelector('.'+c);return {name:d.querySelector('summary').textContent,qty:g('qty').value,capacity:g('capacity').value,start:g('start').value,role:g('role').value,position:g('position').value,equipment:g('equipment').value,setup:g('setup').value,active:g('active').value,machine:g('machine').value,finish:g('finish').value,clean:g('clean').value,shared:g('shared').checked,sharedKey:g('sharedKey').value}})}
async function importMenu(){m2=M2.state(await M2.read(outlet));const master=await M2.read('COMPANY','RECIPE_MASTER','STANDARD_V1').catch(()=>null);const recipes=master?.recipes||[];plan.profiles=[];for(const cat of CAT_ORDER)for(let i=0;i<(ITEM_DATA[cat]||[]).length;i++)if(M2.selected(m2,cat,i)){const item=ITEM_DATA[cat][i],d=M2.draft(m2,cat,i,item),r=recipes.find(x=>String(x.name).toLowerCase()===String(item.recipeName||item.name).toLowerCase());const t=recipeTiming(r,item.name);plan.profiles.push({name:item.name,qty:(Number(d.batchSize)||0)*(Number(d.batches)||0)||d.sold||r?.guideDailyQty||'',capacity:d.batchSize||r?.standardYield||r?.yieldQty||'',start:'05:00',role:t.role,equipment:t.equipment,setup:t.setup,active:t.active,machine:t.machine,finish:t.finish,clean:t.clean,shared:t.shared,sharedKey:t.sharedKey})}render();$('status').textContent='Imported '+plan.profiles.length+' selected items. Confirm preparation times before relying on staffing.'}
function calculate(){readCards();const r=Workload.plan(plan.profiles);let h='<p class="muted"><b>Active labour</b> = human hands-on work. <b>Equipment occupancy</b> = machine/steamer running time. <b>Production window</b> includes both and is not the same as continuous labour.</p><table><tr><th>Task</th><th>Role</th><th>Position</th><th>Production window</th><th>Active labour</th><th>Equipment occupancy</th><th>Cycles</th></tr>'+r.tasks.map(t=>'<tr><td>'+esc(t.name)+'</td><td>'+esc(t.role)+'</td><td>'+esc(t.position||'UNFILLED')+'</td><td>'+Workload.time(t.start)+'–'+Workload.time(t.end)+' ('+t.elapsedMinutes+' min)</td><td>'+t.activeMinutes+' min</td><td>'+t.equipmentMinutes+' min'+(t.equipment?' · '+esc(t.equipment):'')+'</td><td>'+t.cycles+'</td></tr>').join('')+'</table><h3>Position summary</h3><table>'+r.summary.map(x=>'<tr><td>'+esc(x.position)+'</td><td>'+esc(x.role)+'</td><td>'+x.activeMinutes+' min active labour</td><td>'+x.span+' min overall production span</td></tr>').join('')+'</table>';if(r.warnings.length)h+='<div class="warn"><b>Review:</b><br>'+r.warnings.map(esc).join('<br>')+'</div>';else h+='<div class="ok">No entered production-window or equipment conflicts detected.</div>';$('result').innerHTML=h;return r}
async function save(){readCards();const r=calculate();const payload={schema:1,profiles:plan.profiles,calculation:r,review:{ownerReviewed:$('approved').checked,status:$('approved').checked?'owner-reviewed-planning-scenario':'draft'},savedAt:new Date().toISOString()};const old=await BOBS_DATA.getModule(outlet,'WORKLOAD_PLAN','default');if(old)await BOBS_DATA.saveModule(outlet,'WORKLOAD_PLAN_BACKUPS','before-'+Date.now(),old);await BOBS_DATA.saveModule(outlet,'WORKLOAD_PLAN','default',payload);const back=await BOBS_DATA.getModule(outlet,'WORKLOAD_PLAN','default');if(!back)throw Error('Save sent but read-back not confirmed');$('saveStatus').textContent='Saved and read back from Google.'}
async function reload(){const x=await BOBS_DATA.getModule(outlet,'WORKLOAD_PLAN','default');if(x?.profiles){plan=x;$('approved').checked=!!x.review?.ownerReviewed;render();calculate();$('status').textContent='Saved workload plan loaded.'}else $('status').textContent='No saved workload plan yet.'}
$('import').onclick=()=>importMenu().catch(e=>$('status').textContent=e.message);$('add').onclick=()=>{readCards();plan.profiles.push({name:'New workload'});render()};$('calc').onclick=calculate;$('save').onclick=()=>save().catch(e=>$('saveStatus').textContent=e.message);$('reload').onclick=()=>reload().catch(e=>$('status').textContent=e.message);if(!outlet)$('status').textContent='Open from Method 2 with an outlet selected.';else reload().catch(()=>{$('status').textContent='Ready. Import Method 2 menu.'});
</script></body></html>
