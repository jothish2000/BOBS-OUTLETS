<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOBS Google records</title><link rel="stylesheet" href="style.css"><script src="bobs-config.js?v=outlet-flow-20261010"></script><script src="bobs-google-data.js?v=outlet-flow-20261010"></script><script src="bobs-verified-store.js"></script><script src="bobs-number-format.js?v=20261003"></script></head><body><header><h1>Google Sheets records</h1></header><main style="padding:20px"><p><a href="https://docs.google.com/spreadsheets/d/19E32HO9npGZugzpzVm4UvxA40A001GRDVRsBtHy-FR8/edit" target="_blank" rel="noopener">Open authoritative Google Data Vault spreadsheet ↗</a></p><p>Spreadsheet access follows your Google account permissions. The verified record below is read from the configured Data Vault.</p><p id="status" role="status">Reading…</p><pre id="record" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre></main><script>(async()=>{try{const q=new URLSearchParams(location.search),o=q.get('outlet'),m=q.get('module'),k=q.get('key')||'default';if(!o||!m)throw Error('Open from an outlet or item records link.');let r;if(m==='OUTLET_SETUP'){const response=await BOBS_DATA.jsonp({action:'outletList'});if(response?.ok!==true||!Array.isArray(response.outlets))throw Error('Outlet setup not verified.');r=response.outlets}else r=await BOBS_VERIFIED.read(o,m,k);document.getElementById('status').textContent=o+' / '+m+' / '+k+' — '+(r?'Google record read and verified':'No saved record found');document.getElementById('record').textContent=JSON.stringify(r,null,2)}catch(e){document.getElementById('status').textContent='Could not verify Google record: '+e.message}})();</script></body></html>
