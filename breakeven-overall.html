<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Breakeven — Overall</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <p class="eyebrow"><a href="index.html" style="color:inherit;text-decoration:none;">← Home</a></p>
  <h1>Breakeven — whole company</h1>
  <p class="sub">Every outlet's numbers added together, pulled live from BreakEven_Overall on your Google Sheet.</p>
</header>

<section>
  <div class="section-head"><h2>Assess using</h2><span class="tag">your choice</span></div>
  <div class="stack" style="display:flex;gap:8px;padding:10px;">
    <button type="button" class="methodBtn" data-m="m1" style="flex:1;padding:10px 6px;border-radius:4px;border:1.5px solid var(--ink-soft);background:var(--paper-dark);cursor:pointer;font-size:12px;font-weight:700;">Method 1<br><span style="font-weight:400;font-size:10px;color:var(--ink-soft);">hourly, estimate</span></button>
    <button type="button" class="methodBtn" data-m="m2" style="flex:1;padding:10px 6px;border-radius:4px;border:1.5px solid var(--ink-soft);background:var(--paper-dark);cursor:pointer;font-size:12px;font-weight:700;">Method 2<br><span style="font-weight:400;font-size:10px;color:var(--ink-soft);">item-wise, real</span></button>
  </div>
</section>

<div class="export-bar">
  <button class="export-btn" id="loadBtn" type="button">Load company-wide breakeven</button>
</div>

<p class="status" id="loadStatus" style="text-align:center;"></p>

<section id="overallSection" style="display:none;">
  <div class="section-head"><h2>Overall</h2><span class="tag">all outlets</span></div>
  <div class="stack" id="overallResults"></div>
</section>

<section id="perShopSection" style="display:none;">
  <div class="section-head"><h2>By outlet</h2><span class="tag" id="outletCountTag"></span></div>
  <div id="perShopList"></div>
</section>

<footer>Requires Sheets sync to be set up (any page) and the Apps Script redeployed with the latest version.</footer>

<script>
const URL_KEY = 'sheets-sync-url';
const METHOD_KEY = 'breakeven-method-pref';
function fmt(n){ return Math.round(Number(n)||0).toLocaleString('en-IN'); }

let selectedMethod = localStorage.getItem(METHOD_KEY) || 'm2';

function paintMethodButtons(){
  document.querySelectorAll('.methodBtn').forEach(btn => {
    const active = btn.dataset.m === selectedMethod;
    btn.style.borderColor = active ? 'var(--gold)' : 'var(--ink-soft)';
    btn.style.background = active ? 'var(--gold)' : 'var(--paper-dark)';
    btn.style.color = active ? 'var(--ink)' : 'inherit';
  });
}
document.querySelectorAll('.methodBtn').forEach(btn => {
  btn.addEventListener('click', () => {
    selectedMethod = btn.dataset.m;
    localStorage.setItem(METHOD_KEY, selectedMethod);
    paintMethodButtons();
    if(document.getElementById('overallSection').style.display !== 'none') loadBreakeven();
  });
});
paintMethodButtons();

function signedRow(label, value){
  const n = Number(value)||0;
  const color = n>=0 ? 'var(--profit)' : 'var(--loss)';
  return `<div class="row"><span class="rlabel">${label}</span><span class="num" style="font-weight:700;color:${color};">${n>=0?'+':''}₹${fmt(n)}</span></div>`;
}
function plainRow(label, value){
  return `<div class="row"><span class="rlabel">${label}</span><span class="num" style="font-weight:700;">₹${fmt(value)}</span></div>`;
}

async function loadBreakeven(){
  const statusEl = document.getElementById('loadStatus');
  const url = localStorage.getItem(URL_KEY);
  if(!url){
    statusEl.textContent = 'Set up Sheets sync first (Sheet URL field on Method 1, Method 2, Staff, or Fixed Expenses).';
    statusEl.style.color = 'var(--loss)';
    return;
  }
  statusEl.textContent = 'Loading…';
  statusEl.style.color = 'var(--ink-soft)';
  try{
    const res = await fetch(url + '?action=breakeven');
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || 'unknown error');

    const metrics = {};
    (data.overall||[]).forEach(r => { metrics[r['Metric']] = r['Value']; });
    const mLabel = selectedMethod === 'm1' ? 'M1' : 'M2';

    const overallHtml = selectedMethod === 'm1' ? [
      plainRow('Total Method 1 Revenue (all outlets)', metrics['Total Method 1 Revenue (all outlets)']),
      plainRow('Total COGS (M1)', metrics['Total COGS (M1)']),
      plainRow('Total Labour Cost (all outlets)', metrics['Total Labour Cost (all outlets)']),
      plainRow('Total Fixed Costs incl. Labour (all outlets)', metrics['Total Fixed Costs incl. Labour (all outlets)']),
      signedRow('Overall Net P/L (M1)', metrics['Overall Net P/L (M1)']),
    ].join('') : [
      plainRow('Total Method 2 Revenue (all outlets)', metrics['Total Method 2 Revenue (all outlets)']),
      plainRow('Total COGS (M2, real)', metrics['Total COGS (M2, real)']),
      plainRow('Total Labour Cost (all outlets)', metrics['Total Labour Cost (all outlets)']),
      plainRow('Total Fixed Costs incl. Labour (all outlets)', metrics['Total Fixed Costs incl. Labour (all outlets)']),
      signedRow('Overall Net P/L (M2)', metrics['Overall Net P/L (M2)']),
    ].join('');
    document.getElementById('overallResults').innerHTML = overallHtml;
    document.getElementById('overallSection').style.display = 'block';

    const perShop = data.perShop || [];
    document.getElementById('outletCountTag').textContent = perShop.length + (perShop.length===1?' outlet':' outlets');
    const revKey = selectedMethod === 'm1' ? 'Method 1 Revenue Today' : 'Method 2 Revenue Today';
    const cogsKey = selectedMethod === 'm1' ? 'COGS (M1)' : 'COGS (M2, real)';
    const netKey = selectedMethod === 'm1' ? 'Net P/L (M1)' : 'Net P/L (M2)';
    document.getElementById('perShopList').innerHTML = perShop.map(r => {
      const net = Number(r[netKey])||0;
      return `<div class="item-row" style="flex-wrap:wrap;">
        <span class="iname" style="flex-basis:100%;font-weight:700;">${r['Outlet Name']||('Outlet '+r['Outlet ID'])}</span>
        <div style="display:flex;justify-content:space-between;width:100%;margin-top:4px;font-size:11.5px;">
          <span>${mLabel} Revenue: <strong class="num">₹${fmt(r[revKey])}</strong></span>
          <span>COGS: <strong class="num" style="color:var(--loss);">₹${fmt(r[cogsKey])}</strong></span>
        </div>
        <div style="display:flex;justify-content:space-between;width:100%;margin-top:3px;font-size:11.5px;">
          <span>Total Fixed: <strong class="num">₹${fmt(r['Total Fixed'])}</strong></span>
          <span style="color:${net>=0?'var(--profit)':'var(--loss)'};font-weight:700;">Net P/L: ${net>=0?'+':''}₹${fmt(net)}</span>
        </div>
      </div>`;
    }).join('');
    document.getElementById('perShopSection').style.display = perShop.length ? 'block' : 'none';

    statusEl.textContent = 'Loaded ✓';
    statusEl.style.color = 'var(--profit)';
  } catch(e){
    statusEl.textContent = 'Could not reach the Sheet — is doGet deployed? (redeploy the Apps Script as a new version)';
    statusEl.style.color = 'var(--loss)';
  }
}

document.getElementById('loadBtn').addEventListener('click', loadBreakeven);
loadBreakeven();
</script>
</body>
</html>
